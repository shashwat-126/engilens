services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: eng_copilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_change_me}
      POSTGRES_DB: eng_copilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eng_copilot -d eng_copilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://eng_copilot:${POSTGRES_PASSWORD:-dev_password_change_me}@postgres:5432/eng_copilot
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env before running docker-compose -- see README}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PORT: 4000
    ports:
      - "4000:4000"
    restart: unless-stopped

  # A second, independently-scalable consumer of the same ingestion queue --
  # the API's own in-process worker (server.ts) still runs too, so this is
  # additive capacity, not a replacement. Scale with
  # `docker compose up --scale worker=3`.
  worker:
    build: ./backend
    command: ["node", "dist/worker.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://eng_copilot:${POSTGRES_PASSWORD:-dev_password_change_me}@postgres:5432/eng_copilot
      REDIS_URL: redis://redis:6379
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:4000/api/v1}
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
